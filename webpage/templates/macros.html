{% macro date(d) %}{{ d | date(format="%Y-%m-%d") }}{% endmacro date %}

{% macro pager(p) %}
  {% if p.previous or p.next %}
    <nav class="pager">
      {% if p.previous %}<a href="{{ p.previous }}">&larr; Newer</a>{% endif %}
      {% if p.next %}<a href="{{ p.next }}" style="margin-left:1rem">Older &rarr;</a>{% endif %}
    </nav>
  {% endif %}
{% endmacro pager %}
