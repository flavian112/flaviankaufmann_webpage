name: build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0

      - run: zola build --force

      - run: tar -czf public.tar.gz -C public .

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public.tar.gz
